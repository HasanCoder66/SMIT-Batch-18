    <title>Grid System</title>
</head>
<style>
    .container {
        border: 2px solid black;
        display: grid;
        /* grid-template-rows: 200px 150px 100px; */
        /* grid-template-columns: 400px 150px 100px; */
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
        /* grid-template-columns: repeat(6, 200px); */
        /* column-gap: 20px;
        row-gap: 20px; */
        grid-gap: 30px;
    }
    .boxes {
        /* height: 120px; */
        /* width: 200px; */
        border: 2px solid green;
        background-color: lightgreen;
    }

.item-1 {
    grid-column-start: 2;
    grid-column-end: 3;
        grid-row-start: 1;
        grid-row-end: 2;
}

    .item-4 {
        grid-row-start: 1;
        grid-row-end: 2;
        grid-column-start: 2 ;
        grid-column-end: 3 ;
    }

    
</style>
<body>
    
    <div class="alert alert-success" role="alert">
  A simple primary alert—check it out!
</div>

<button type="button" class="btn btn-success btnColor">Base class</button>
